name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two OCP lines callers actually run: cadquery 2.8 pins OCP 7.9, build123d 0.13 uses OCP 8.
        ocp: ["7.9.3.1.1", "8.0.1.1.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Install with OCP ${{ matrix.ocp }}
        run: |
          uv sync --locked --extra ocp
          uv pip install "cadquery-ocp-novtk==${{ matrix.ocp }}" "cadquery-ocp-proxy==${{ matrix.ocp }}"
      - name: Lint
        run: uv run --no-sync ruff check src tests tools && uv run --no-sync ruff format --check src tests tools
      - name: Types
        run: uv run --no-sync mypy src
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Generated docs are current
        run: uv run --no-sync python tools/gen_docs.py --check
      - name: Dependency audit
        run: uv run --no-sync pip-audit --skip-editable --progress-spinner off
