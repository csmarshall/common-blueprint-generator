# Dogfood: this repo renders its own README example with the reusable workflow, at the commit being pushed.
name: Render README example

on:
  push:
    branches: [main]
    paths: ["src/**", "examples/**", ".github/workflows/render.yml", ".github/workflows/self-render.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    uses: ./.github/workflows/render.yml
    with:
      configs: examples/blueprint.yml
      generator-ref: ${{ github.sha }}
      commit-paths: examples README.md
